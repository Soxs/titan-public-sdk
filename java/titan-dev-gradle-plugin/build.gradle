plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'net.titan'
version = providers.gradleProperty('titanDevPluginVersion').get()

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
tasks.named('test') { useJUnitPlatform() }

// What a project which applies net.titan.runelite compiles against: what was published with this plugin.
evaluationDependsOn(':titan-runelite')
tasks.named('processResources') {
    def values = [sdk: providers.gradleProperty('titanJavaSdkVersion').get(),
                  runelite: project(':titan-runelite').version.toString(), lombok: '1.18.42']
    inputs.properties(values)
    filesMatching('net/titan/dev/versions.properties') { expand(values) }
}

gradlePlugin {
    plugins {
        titanDev {
            id = 'net.titan.dev'
            implementationClass = 'net.titan.dev.TitanDevPlugin'
            displayName = 'Titan dev plugin staging'
            description = 'Stages a plugin JAR into a TitanClient dev session ' +
                'and launches/recycles a DEV tab so edits hot-reload via the ' +
                'in-tab refresh button.'
        }
        titanRuneLite {
            id = 'net.titan.runelite'
            implementationClass = 'net.titan.dev.TitanRuneLitePlugin'
            displayName = 'Titan plugins with the RuneLite API'
            description = 'Everything a Titan plugin written with the RuneLite API needs: RuneLite, ' +
                'Titan\'s SDK, Lombok and the Titan dev loop.'
        }
    }
}

publishing {
    // The java-gradle-plugin plugin registers two publications:
    //   pluginMaven                         -> the implementation jar
    //                                          (net.titan:titan-dev-gradle-plugin)
    //   net.titan.devPluginMarkerMaven      -> the plugin marker
    //                                          (net.titan.dev:net.titan.dev.gradle.plugin)
    // Both are published by `publish`; consumers resolve them through the raw
    // GitHub maven repo declared in their settings.gradle pluginManagement.
    repositories {
        def repositoryUrl = providers.environmentVariable('TITAN_MAVEN_REPOSITORY_URL').orNull
        def repositoryUsername = providers.environmentVariable('TITAN_MAVEN_USERNAME').orNull
        def repositoryPassword = providers.environmentVariable('TITAN_MAVEN_PASSWORD').orNull
        if (repositoryUrl) {
            maven {
                name = 'titan'
                url = uri(repositoryUrl)
                if (repositoryUsername != null || repositoryPassword != null) {
                    credentials {
                        username = repositoryUsername ?: ''
                        password = repositoryPassword ?: ''
                    }
                }
            }
        }
    }
}
