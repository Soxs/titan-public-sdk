plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.titan'
version = providers.gradleProperty('titanJavaSdkVersion').get()

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

repositories {
    mavenCentral()
}

def titanRoot = projectDir.parentFile.parentFile
def titanGamevalToolDir = new File(titanRoot, 'tools/gamevals')
def titanGamevalGradle = new File(projectDir, System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    ? 'gradlew.bat'
    : 'gradlew')
def titanGenerateGamevals = providers.gradleProperty('titanGenerateGamevals')
    .orElse(providers.environmentVariable('TITAN_GENERATE_GAMEVALS'))
    .map { it.toBoolean() }
    .orElse(true)
def titanGamevalRevision = providers.gradleProperty('titanGamevalRevision')
    .orElse(providers.environmentVariable('TITAN_GAMEVAL_REVISION'))
    .orElse('live')
def titanGamevalJavaHome = providers.gradleProperty('titanGamevalJavaHome')
    .orElse(providers.environmentVariable('TITAN_GAMEVAL_JAVA_HOME'))
def titanGamevalJsonDir = providers.gradleProperty('titanGamevalJsonDir')
    .orElse(new File(titanRoot, 'build/generated/gamevals').absolutePath)

tasks.register('generateTitanGamevals', Exec) {
    group = 'generation'
    description = 'Refresh generated native gameval Java SDK sources from the local OSRS cache.'
    onlyIf {
        titanGenerateGamevals.get()
            && titanGamevalGradle.isFile()
            && new File(titanGamevalToolDir, 'build.gradle').isFile()
    }
    workingDir titanRoot
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', titanGamevalGradle.absolutePath
    } else {
        commandLine titanGamevalGradle.absolutePath
    }
    args '--no-daemon',
        '-p', titanGamevalToolDir.absolutePath,
        'generateGamevals',
        "-PtitanRoot=${titanRoot.absolutePath}",
        "-PjsonDir=${titanGamevalJsonDir.get()}",
        "-Prevision=${titanGamevalRevision.get()}"
    doFirst {
        def javaHome = titanGamevalJavaHome.orNull
        if ((javaHome == null || javaHome.isBlank())
            && System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            def localJdk25 = new File('C:/Program Files/Java/jdk-25')
            if (new File(localJdk25, 'bin/java.exe').isFile()) {
                javaHome = localJdk25.absolutePath
            }
        }
        if (javaHome != null && !javaHome.isBlank()) {
            environment 'JAVA_HOME', javaHome
        }
    }
}

dependencies {
    api 'com.google.inject:guice:7.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateTitanGamevals')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateTitanGamevals')
}

tasks.named('javadoc') {
    dependsOn tasks.named('generateTitanGamevals')
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'titan-plugin-api'
        }
    }

    repositories {
        def repositoryUrl = providers.environmentVariable('TITAN_MAVEN_REPOSITORY_URL').orNull
        def repositoryUsername = providers.environmentVariable('TITAN_MAVEN_USERNAME').orNull
        def repositoryPassword = providers.environmentVariable('TITAN_MAVEN_PASSWORD').orNull
        if (repositoryUrl) {
            maven {
                name = 'titan'
                url = uri(repositoryUrl)
                if (repositoryUsername != null || repositoryPassword != null) {
                    credentials {
                        username = repositoryUsername ?: ''
                        password = repositoryPassword ?: ''
                    }
                }
            }
        }
    }
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def titanApiOverrideDir = file(providers.gradleProperty('titanApiOverrideDir')
    .orElse(providers.environmentVariable('TITAN_JAVA_API_OVERRIDE_DIR'))
    .orElse(new File(System.getProperty('user.home'), '.titanclient/java-dev').absolutePath)
    .get())
def titanApiOverrideJar = new File(titanApiOverrideDir, 'titan-plugin-api.jar')
def titanLaunchTaskName = 'runTitanClient'

def expandTitanPath = { String rawPath ->
    def value = rawPath == null ? null : rawPath.trim()
    if (value == null || value.isEmpty()) {
        return null
    }

    def userProfile = System.getenv('USERPROFILE') ?: System.getProperty('user.home')
    value = value.replace('%USERPROFILE%', userProfile)
        .replace('%userprofile%', userProfile)

    if (value == '~') {
        return System.getProperty('user.home')
    }
    if (value.startsWith('~/') || value.startsWith('~\\')) {
        return new File(System.getProperty('user.home'), value.substring(2)).path
    }
    return value
}

def launcherReleaseFromRepositoryRoot = { File repositoryRoot ->
    if (repositoryRoot == null || !isWindows) {
        return null
    }

    def stateJson = new File(repositoryRoot, 'state.json')
    if (!stateJson.isFile()) {
        return null
    }

    try {
        def state = new groovy.json.JsonSlurper().parse(stateJson)
        def version = state?.current_version?.toString()
        if (version == null || !version.matches(/[A-Za-z0-9._-]{1,64}/)) {
            return null
        }

        def candidate = new File(repositoryRoot, "releases/${version}")
        if (new File(candidate, 'controller.exe').isFile() && new File(candidate, 'manifest.json').isFile()) {
            return candidate
        }
    } catch (ignored) {
        return null
    }

    return null
}

def configuredTitanClientRoot = {
    def gradleProperty = providers.gradleProperty('titanClientRoot').orNull
    if (gradleProperty != null && !gradleProperty.trim().isEmpty()) {
        return expandTitanPath(gradleProperty)
    }

    def environmentVariable = providers.environmentVariable('TITAN_CLIENT_ROOT').orNull
    if (environmentVariable != null && !environmentVariable.trim().isEmpty()) {
        return expandTitanPath(environmentVariable)
    }

    return null
}

def launcherRepositoryClientRoot = {
    launcherReleaseFromRepositoryRoot(new File(System.getProperty('user.home'), '.titanclient/repository'))
}

def titanClientRootCandidates = {
    def candidates = []
    def addCandidate = { File candidate ->
        if (candidate != null) {
            candidates.add(candidate)
        }
    }

    addCandidate(launcherRepositoryClientRoot())

    if (isWindows) {
        def programFiles = System.getenv('ProgramFiles')
        if (programFiles) {
            addCandidate(new File(programFiles, 'TitanClient'))
        }

        def programFilesX86 = System.getenv('ProgramFiles(x86)')
        if (programFilesX86) {
            addCandidate(new File(programFilesX86, 'TitanClient'))
        }

        def localAppData = System.getenv('LOCALAPPDATA')
        if (localAppData) {
            addCandidate(new File(localAppData, 'TitanClient'))
            addCandidate(new File(localAppData, 'Programs/TitanClient'))
        }
    }

    def cursor = projectDir
    while (cursor != null) {
        addCandidate(new File(cursor, 'build/controller/Debug'))
        addCandidate(new File(cursor, 'build/controller/RelWithDebInfo'))
        addCandidate(new File(cursor, 'build/controller/Release'))
        cursor = cursor.parentFile
    }

    def seen = [] as Set
    candidates.findAll { seen.add(it.absolutePath.toLowerCase(Locale.ROOT)) }
}

def titanClientRootHelp = { File checkedController = null ->
    def lines = []
    if (checkedController != null) {
        lines << "TitanClient controller.exe was not found."
        lines << "Checked: ${checkedController.absolutePath}"
    } else {
        lines << "TitanClient runtime path is not configured, and no launcher repository/common install/source-build location was auto-detected."
    }
    lines << ''
    lines << 'runTitanClient needs either the TitanLauncher repository root or the folder that directly contains controller.exe.'
    lines << 'Use the repository/runtime folder path, not controller.exe itself and not the plugins folder.'
    lines << ''
    lines << 'Run TitanLauncher.exe once so it syncs a release into:'
    lines << '  %USERPROFILE%\\.titanclient\\repository'
    lines << ''
    lines << 'Edit the titanClientRoot entry in gradle.properties:'
    lines << '  titanClientRoot=%USERPROFILE%/.titanclient/repository'
    lines << "  .\\gradlew.bat ${titanLaunchTaskName}"
    lines << ''
    lines << 'Or set it for this PowerShell session:'
    lines << '  $env:TITAN_CLIENT_ROOT = "%USERPROFILE%/.titanclient/repository"'
    lines << "  .\\gradlew.bat ${titanLaunchTaskName}"
    lines << ''
    lines << 'One-off Gradle property:'
    lines << "  .\\gradlew.bat ${titanLaunchTaskName} \"-PtitanClientRoot=%USERPROFILE%/.titanclient/repository\""
    lines << ''
    lines << 'For a local TitanClient source build, build controller first and use:'
    lines << "  .\\gradlew.bat ${titanLaunchTaskName} \"-PtitanClientRoot=C:\\path\\to\\SoxClientOSRS\\build\\controller\\Debug\""
    lines.join(System.lineSeparator())
}

def resolveTitanController = {
    def configuredRoot = configuredTitanClientRoot()
    if (configuredRoot) {
        def configuredRootFile = new File(configuredRoot)
        def runtimeRoot = launcherReleaseFromRepositoryRoot(configuredRootFile) ?: configuredRootFile
        def controller = new File(runtimeRoot, 'controller.exe')
        if (!controller.isFile()) {
            throw new GradleException(titanClientRootHelp(controller))
        }
        return controller
    }

    def controller = titanClientRootCandidates()
        .collect { new File(it, 'controller.exe') }
        .find { it.isFile() }
    if (controller != null) {
        logger.lifecycle("Auto-detected TitanClient at ${controller.parentFile}")
        return controller
    }

    throw new GradleException(titanClientRootHelp(null))
}

def titanEmbeddedJarFromEnvironment = {
    def value = providers.environmentVariable('TITAN_JAVA_EMBEDDED_JAR').orNull
    if (value == null || value.trim().isEmpty()) {
        return null
    }
    return new File(value.trim())
}

def titanEmbeddedHelp = { File controller, File checkedRuntime = null ->
    def lines = []
    lines << 'TitanClient embedded Java runtime was not found.'
    if (checkedRuntime != null) {
        lines << "Checked: ${checkedRuntime.absolutePath}"
    }
    lines << ''
    lines << 'Java plugins need titan-java-embedded.jar for metadata inspection and the in-process runtime.'
    lines << 'Use an installed TitanClient build that includes the Java runtime, or point titanClientRoot at a source build staged with Java enabled.'
    lines << ''
    lines << 'For a local TitanClient source build:'
    lines << '  cmake -S . -B build -DTITAN_BUILD_JAVA_RUNTIME=ON'
    lines << '  cmake --build build --config Release --target controller'
    lines << '  titanClientRoot=C:/path/to/SoxClientOSRS/build/controller/Release'
    lines << ''
    lines << 'Expected installed/source-build layout:'
    lines << "  ${new File(controller.parentFile, 'java/titan-java-embedded.jar').absolutePath}"
    lines << ''
    lines << 'Maintainers can also set TITAN_JAVA_EMBEDDED_JAR to an absolute runtime JAR path.'
    lines.join(System.lineSeparator())
}

def verifyTitanJavaEmbedded = { File controller ->
    def envRuntime = titanEmbeddedJarFromEnvironment()
    if (envRuntime != null) {
        if (!envRuntime.isFile()) {
            throw new GradleException(titanEmbeddedHelp(controller, envRuntime))
        }
        return
    }

    def colocatedRuntime = new File(controller.parentFile, 'java/titan-java-embedded.jar')
    if (!colocatedRuntime.isFile()) {
        throw new GradleException(titanEmbeddedHelp(controller, colocatedRuntime))
    }
}

tasks.register('stageTitanApiOverride', Copy) {
    group = 'titan dev'
    description = 'Build and stage this SDK JAR for the installed TitanClient embedded runtime.'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into titanApiOverrideDir
    rename { 'titan-plugin-api.jar' }
    doLast {
        logger.lifecycle("Staged Java API override into ${titanApiOverrideJar}")
    }
}

tasks.register('runTitanClient', Exec) {
    group = 'titan dev'
    description = 'Stage this SDK JAR and launch installed TitanClient in DEV mode.'
    dependsOn tasks.named('stageTitanApiOverride')
    doFirst {
        if (!isWindows) {
            throw new GradleException('TitanClient DEV launch currently requires Windows.')
        }
        def controller = resolveTitanController()
        verifyTitanJavaEmbedded(controller)
        workingDir controller.parentFile
        commandLine controller, '--dev-mode', '--launch-new-client'
        environment 'TITAN_JAVA_API_JAR', titanApiOverrideJar.absolutePath
    }
}
