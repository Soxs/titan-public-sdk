# Default TitanLauncher sync repository. The Gradle dev tooling resolves
# state.json to the current releases/<version> directory containing controller.exe.
titanClientRoot=%USERPROFILE%/.titanclient/repository

# Maven artifact version for net.titan:titan-plugin-api.
titanJavaSdkVersion=0.1.26

# Version for the net.titan.dev Gradle convention plugin
# (net.titan:titan-dev-gradle-plugin + its net.titan.dev marker).
titanDevPluginVersion=0.1.1
